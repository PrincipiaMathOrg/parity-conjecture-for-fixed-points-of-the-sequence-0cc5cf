fidelity:
  divergences: "The Lean statement is more general than the conjecture as posed: it quantifies over every odd natural number p (not only odd primes) and every sequence a with a(n) dividing p n (n-1) / 2 for n >= 1 (not only the greedy sequence A(p)). The greedy sequence satisfies that hypothesis by its defining rule, as the write-up notes; that instantiation is not itself formalized. Division by 2 is truncated division on the natural numbers; it is exact here because n (n-1) is even."

