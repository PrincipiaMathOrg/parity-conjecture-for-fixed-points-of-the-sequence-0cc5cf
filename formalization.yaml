version: "v0.4"

project:
  name: "Parity conjecture for fixed points of the sequences A(p)"
  description: "For an odd prime p, Navarrete and Orellana define a sequence A(p) in which a_p(n) is the least unused positive divisor of q_p(n) = p n (n-1) / 2. Their Conjecture 3.1 says that a fixed point, an index n with a_p(n) = n, is always odd. This formalization proves it: for every odd p and every sequence a with a(n) dividing p n (n-1) / 2 for all n >= 1, a(n) = n implies n odd."
  authors:
    - "anton"
  license: "Apache-2.0"
  responsible_maintainers:
    - "anton"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11B83", "11A05"]

sources:
  - title: "Parity of fixed points of the Navarrete-Orellana sequences (MathDB 343324), solution write-up"
    id: "https://principia-staging.anton-8d8.workers.dev/api/ws/files/d62aab2656adf57ccc83ffa4f01e1ef6"
    type: "paper"
    location: "https://principia-staging.anton-8d8.workers.dev/projects/0cc5cf82e6784589bd27717599c10cc0"
    relationship: "formalizes"
    note: "The solution write-up linked on the Principia project; its Theorem 1 and the proof given there are what Solution.lean follows."
  - title: "Finding Prime Numbers as Fixed Points of Sequences"
    authors:
      - "E. Navarrete"
      - "D. Orellana"
    id: "arXiv:1907.10023v1"
    type: "paper"
    location: "https://arxiv.org/abs/1907.10023"
    relationship: "background"
    note: "Source of the sequences A(p) and of the conjecture (Conjecture 3.1)."

