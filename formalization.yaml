version: "v0.4"

project:
  name: "Parity conjecture for fixed points of the sequences A(p)"
  description: >-
    Let A(p) be the sequence constructed from an odd prime p, and call an integer n a fixed
    point when a(n)=n. **Parity conjecture.** The fixed points of sequences A(p), for p an
    odd prime, are odd. This observation appeared in all cases computed in the paper. The
    statement is also suggested for A(1), but the conjecture here concerns the sequences
    A(p) with p an odd prime.
  authors:

  license: "Apache-2.0"
  responsible_maintainers:


